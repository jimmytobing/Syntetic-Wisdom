name: SF - WDE API (Issue request)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: sf-api-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  call-salesforce-api:
    if: >-
      contains(fromJSON('["jimmytobing","098595"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Sf Request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SF_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID || secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact Sf Request heading
        id: route
        shell: bash
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -Eq '^### Sf Request[[:space:]]*$'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run Salesforce issue request and prepare collapsible evidence
        id: jim
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sf.mjs
      - name: Publish result in the same Issue
        if: always() && steps.route.outputs.valid == 'true' && steps.jim.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/sf-evidence.md" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sf-evidence.md"
          else
            echo 'No evidence file generated; see job logs.' >&2
            exit 1
          fi

  run-sf-bash:
    if: >-
      contains(fromJSON('["jimmytobing","098595"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Sf Bash')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASH_HEADING: Sf Bash
    steps:
      - name: Checkout without stored Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check exact Sf Bash heading
        id: route
        shell: bash
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -Eq '^### Sf Bash[[:space:]]*$'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Salesforce CLI from official compressed TAR (no npm/cache)
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/wde-sf-cli"
          CLI_TAR="$RUNNER_TEMP/sf-linux-x64.tar.xz"
          mkdir -p "$CLI_DIR"
          # Salesforce's versioned installer (official release 2.159.5).
          CLI_URL="https://developer.salesforce.com/media/salesforce-cli/sf/versions/2.159.5/9d74d04/sf-v2.159.5-9d74d04-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 "$CLI_URL" -o "$CLI_TAR"
          tar -xJf "$CLI_TAR" -C "$CLI_DIR" --strip-components 1
          rm -f "$CLI_TAR"
          echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
          "$CLI_DIR/bin/sf" --version
      - name: Authenticate Salesforce CLI to WDE (hdbsf)
        if: steps.route.outputs.valid == 'true'
        shell: bash
        env:
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID || secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node scripts/sf-cli-auth.mjs
      - name: Execute isolated Sf Bash
        id: bash
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: node scripts/sf-bash.mjs
      - name: Upload Sf Bash evidence
        if: always() && steps.route.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sf-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-bash-evidence.md
          if-no-files-found: error
          retention-days: 1

  publish-sf-bash:
    needs: run-sf-bash
    if: always() && needs.run-sf-bash.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Sf Bash evidence
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: sf-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-bash-result
      - name: Publish Sf Bash output in same Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sf-bash-result/sf-bash-evidence.md"

  run-sf-deploy:
    if: >-
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.actor == 'jimmytobing' &&
      github.event.issue.user.login == 'jimmytobing' &&
      contains(github.event.issue.body, '### Sf Deploy')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
      WDE_DEPLOY_ENABLED: ${{ vars.WDE_DEPLOY_ENABLED }}
      CANDIDATE_DIR: ${{ github.workspace }}/candidate
    steps:
      - name: Checkout trusted gateway code (no persisted Git credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: trusted
      - name: Strict Sf Deploy request/actor/org preflight
        id: route
        shell: bash
        run: node trusted/scripts/sf-deploy.mjs preflight
      - name: Checkout immutable candidate SHA without persisted credentials
        if: steps.route.outcome == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.route.outputs.sha }}
          persist-credentials: false
          path: candidate
      - name: Inspect candidate manifest and Draft-only Flow metadata
        id: inspect
        if: steps.route.outcome == 'success'
        shell: bash
        run: node trusted/scripts/sf-deploy.mjs inspect
      - name: Install official Salesforce CLI (no npm)
        id: install
        if: steps.route.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/wde-sf-cli"
          CLI_TAR="$RUNNER_TEMP/sf-linux-x64.tar.xz"
          mkdir -p "$CLI_DIR"
          CLI_URL="https://developer.salesforce.com/media/salesforce-cli/sf/versions/2.159.5/9d74d04/sf-v2.159.5-9d74d04-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 "$CLI_URL" -o "$CLI_TAR"
          tar -xJf "$CLI_TAR" -C "$CLI_DIR" --strip-components 1
          rm -f "$CLI_TAR"
          echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
          "$CLI_DIR/bin/sf" --version
      - name: Authenticate CLI using trusted gateway script
        id: auth
        if: steps.route.outcome == 'success'
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID || secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
        run: node trusted/scripts/sf-cli-auth.mjs
      - name: Verify Salesforce LIVE Org ID and execute requested validate/deploy
        id: execute
        if: steps.route.outcome == 'success'
        shell: bash
        run: node trusted/scripts/sf-deploy.mjs run
      - name: Prepare evidence if CLI or checkout failed before execution
        if: always()
        shell: bash
        env:
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/sf-deploy-evidence.md"
          if [[ ! -s "$FILE" ]]; then
            {
              echo "## Sf Deploy — WDE — Issue $ISSUE_NUMBER"
              echo
              echo "Status: **FAILED before Salesforce result**"
              echo
              echo "preflight=$ROUTE_OUTCOME; inspect=$INSPECT_OUTCOME; cli_install=$INSTALL_OUTCOME; auth=$AUTH_OUTCOME; execute=$EXECUTE_OUTCOME"
              echo
              echo "See job logs. No Salesforce deployment success is claimed."
            } > "$FILE"
          fi
      - name: Upload sanitized Sf Deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sf-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-deploy-evidence.md
          if-no-files-found: warn
          retention-days: 1

  publish-sf-deploy:
    needs: run-sf-deploy
    if: always() && needs.run-sf-deploy.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Sf Deploy evidence
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: sf-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-deploy-result
      - name: Publish response in the originating Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/sf-deploy-result/sf-deploy-evidence.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sf-deploy-result/sf-deploy-evidence.md"
