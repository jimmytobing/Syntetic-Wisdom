name: WDE - Request Gateway (Issue #35, GET-only Gemini diagnostic)

on:
  issues:
    types: [edited]
  pull_request:
    paths:
      - '.github/workflows/wde-gemini-inspect-35.yml'
      - 'scripts/wde-gemini-inspect-existing.mjs'
      - 'tests/wde-gemini-inspect-existing.test.mjs'

permissions:
  contents: read

concurrency:
  group: wde-gemini-inspect-35
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          node --check scripts/wde-gemini-inspect-existing.mjs
          node --test tests/wde-gemini-inspect-existing.test.mjs

  inspect:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'edited' &&
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.actor == 'jimmytobing' &&
      github.event.issue.number == 35 &&
      github.event.issue.user.login == 'jimmytobing' &&
      contains(github.event.issue.body, '### WDE Request') &&
      contains(github.event.issue.body, 'sourceRunId') &&
      !contains(github.event.issue.body, 'gemini.audio_recover')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download only the existing Gemini receipt artifact (no inference)
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: wde-gemini-l1-43545052586
          run-id: 43545052586
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gemini-inspect
      - name: Validate request, claim once, GET existing interaction and sanitize
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          WDE_GEMINI_API_KEY: ${{ secrets.WDE_GEMINI_API_KEY }}
          WDE_RECEIPT_PATH: ${{ runner.temp }}/gemini-inspect/wde-gemini-receipt.json
        run: node scripts/wde-gemini-inspect-existing.mjs
      - name: Publish redacted diagnostic in same Issue
        if: always() && steps.inspect.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/wde-gemini-inspect-35.md" ]]; then
            gh issue comment 35 --repo jimmytobing/Syntetic-Wisdom --body-file "$RUNNER_TEMP/wde-gemini-inspect-35.md"
          else
            echo 'Inspection did not produce a diagnostic; see sanitized job status.' >&2
            exit 1
          fi
