name: WDE - Gemini Audio Recovery (GET-only, Issue #35)

on:
  issues:
    types: [edited]
  pull_request:
    paths:
      - '.github/workflows/wde-gemini-audio-recover-35.yml'
      - 'scripts/wde-gemini-audio-recover.mjs'
      - 'scripts/wde-gemini-editorial-l1.mjs'
      - 'tests/wde-gemini-audio-recover.test.mjs'
      - 'tests/wde-gemini-editorial-l1.test.mjs'

permissions:
  contents: read

concurrency:
  group: wde-gemini-audio-recover-35
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          node --check scripts/wde-gemini-audio-recover.mjs
          node --check scripts/wde-gemini-editorial-l1.mjs
          node --test tests/wde-gemini-audio-recover.test.mjs tests/wde-gemini-editorial-l1.test.mjs

  recover:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'edited' &&
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.actor == 'jimmytobing' &&
      github.event.issue.number == 35 &&
      github.event.issue.user.login == 'jimmytobing' &&
      contains(github.event.issue.body, '### WDE Request') &&
      contains(github.event.issue.body, 'gemini.audio_recover')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download receipt of existing completed audio probe
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: wde-gemini-l1-43552315195
          run-id: 43552315195
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audio-recovery
      - name: Verify request and claim, GET existing interaction once
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          WDE_GEMINI_API_KEY: ${{ secrets.WDE_GEMINI_API_KEY }}
          WDE_RECEIPT_PATH: ${{ runner.temp }}/audio-recovery/wde-gemini-receipt.json
        run: node scripts/wde-gemini-audio-recover.mjs
      - name: Upload sanitized result for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wde-gemini-audio-recovered-${{ github.run_id }}
          path: ${{ runner.temp }}/wde-gemini-recovered-audio.json
          if-no-files-found: warn
          retention-days: 1
      - name: Record result in canonical Issue
        if: always() && steps.recover.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/wde-gemini-recovery-issue.md" ]]; then
            gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/wde-gemini-recovery-issue.md"
          else
            echo 'Recovery produced no validated response (see job status only).' >&2
            exit 1
          fi
