name: Salesforce RCA Read-Only

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      operation:
        description: Operasi RCA yang telah diizinkan
        required: true
        type: choice
        options:
          - schema_wde_trend
          - query_wde_trend_count
          - tooling_wde_metadata
          - universal_read
      mock:
        description: Gunakan respons mock tanpa credential Salesforce
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: salesforce-rca-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'salesforce-rca-approved')
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.gate.outputs.operation }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit test keamanan universal gateway
        shell: bash
        run: node --test tests/salesforce-rca-universal.test.mjs tests/salesforce-rca-metadata.test.mjs

      - name: Validasi actor dan request
        id: gate
        env:
          ALLOWED_ACTORS: ${{ vars.RCA_ALLOWED_ACTORS }}
          REPOSITORY_MODE: ${{ vars.RCA_MODE }}
          ACTOR: ${{ github.actor }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABEL: ${{ github.event.label.name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_MOCK: ${{ inputs.mock }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: node scripts/salesforce-rca-gate.mjs

  mock:
    needs: authorize
    if: needs.authorize.outputs.mode == 'mock' && needs.authorize.outputs.operation != 'universal_read'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Jalankan diagnostik mock
        env:
          OPERATION: ${{ needs.authorize.outputs.operation }}
        shell: bash
        run: node scripts/salesforce-rca.mjs --operation "$OPERATION" --output "$RUNNER_TEMP/rca-result.md" --mock

      - name: Kirim ringkasan ke Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/rca-result.md"

      - name: Tampilkan hasil mock di summary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: cat "$RUNNER_TEMP/rca-result.md" >> "$GITHUB_STEP_SUMMARY"

  live:
    needs: authorize
    if: needs.authorize.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Jalankan diagnostik live read-only dari main
        if: needs.authorize.outputs.operation != 'universal_read'
        env:
          SF_RCA_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID }}
          SF_RCA_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET }}
          SF_RCA_LOGIN_URL: ${{ secrets.SF_RCA_LOGIN_URL }}
          OPERATION: ${{ needs.authorize.outputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SF_RCA_CLIENT_ID" && -n "$SF_RCA_CLIENT_SECRET" && -n "$SF_RCA_LOGIN_URL" ]] || {
            echo "Repository Secrets live belum dikonfigurasi lengkap"
            exit 1
          }
          node scripts/salesforce-rca.mjs --operation "$OPERATION" --output "$RUNNER_TEMP/rca-result.md"

      - name: Tampilkan hasil live di summary
        if: github.event_name == 'workflow_dispatch' && needs.authorize.outputs.operation != 'universal_read'
        shell: bash
        run: cat "$RUNNER_TEMP/rca-result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: RAW LIVE Salesforce to requested Issue
        if: needs.authorize.outputs.mode == 'live'
        env:
          SF_RCA_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID }}
          SF_RCA_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET }}
          SF_RCA_LOGIN_URL: ${{ secrets.SF_RCA_LOGIN_URL }}
          SF_META_CLIENT_ID: ${{ secrets.SF_META_CLIENT_ID }}
          SF_META_CLIENT_SECRET: ${{ secrets.SF_META_CLIENT_SECRET }}
          SF_META_LOGIN_URL: ${{ secrets.SF_META_LOGIN_URL }}
          SF_META_USER_ID: ${{ vars.SF_META_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ needs.authorize.outputs.operation }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '9' }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          if [[ "$OPERATION" == "universal_read" ]]; then
            node scripts/salesforce-rca-universal.mjs || status=$?
          else
            node scripts/salesforce-rca-raw-live.mjs || status=$?
          fi
          if [[ -f "$RUNNER_TEMP/sf-raw-evidence.md" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sf-raw-evidence.md"
          fi
          exit "$status"

      - name: Upload Metadata ZIP artifact (private, short retention)
        if: github.event_name == 'issues' && needs.authorize.outputs.operation == 'universal_read'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-metadata-retrieve.zip
          if-no-files-found: ignore
          retention-days: 1
