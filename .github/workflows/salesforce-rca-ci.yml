name: Salesforce RCA CI

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/salesforce-rca.yml"
      - ".github/workflows/salesforce-rca-ci.yml"
      - "scripts/salesforce-rca*.mjs"
      - "tests/salesforce-rca*.test.mjs"
      - "config/salesforce-rca/**"
      - "force-app/main/default/permissionsets/Salesforce_AI_RCA_ReadOnly.permissionset-meta.xml"

permissions:
  contents: read

concurrency:
  group: salesforce-rca-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validasi YAML
        shell: bash
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/salesforce-rca-ci.yml'); YAML.load_file('.github/ISSUE_TEMPLATE/salesforce-rca.yml')"

      - name: Validasi XML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path("force-app/main/default/permissionsets/Salesforce_AI_RCA_ReadOnly.permissionset-meta.xml"),
              *Path("config/salesforce-rca").glob("*.template"),
          ]
          for file in files:
              ET.parse(file)
          print(f"XML valid: {len(files)} file")
          PY

      - name: Validasi sintaks JavaScript
        shell: bash
        run: |
          node --check scripts/salesforce-rca.mjs
          node --check scripts/salesforce-rca-gate.mjs

      - name: Jalankan unit dan security tests
        shell: bash
        run: node --test tests/salesforce-rca*.test.mjs

      - name: Jalankan tiga mock operations
        shell: bash
        run: |
          set -euo pipefail
          for operation in schema_wde_trend query_wde_trend_count tooling_wde_metadata; do
            output="$RUNNER_TEMP/${operation}.md"
            node scripts/salesforce-rca.mjs --operation "$operation" --output "$output" --mock
            grep -Fq "Mode: **MOCK**" "$output"
            grep -Fq "Data ini adalah simulasi lokal" "$output"
          done

      - name: Negative test operasi bebas
        shell: bash
        run: |
          if node scripts/salesforce-rca.mjs --operation "SELECT Id FROM User" --output "$RUNNER_TEMP/invalid.md" --mock; then
            echo "Operasi bebas seharusnya ditolak"
            exit 1
          fi
