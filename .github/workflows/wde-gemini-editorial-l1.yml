name: WDE - Gemini Editorial L1 (manual, Free Tier)

on:
  workflow_dispatch:
    inputs:
      free_tier_ack:
        description: "Verify project coba-oauth-375505 shows Free Tier now; enter FREE_TIER_CONFIRMED"
        required: true
        type: string
      rights_ack:
        description: "Confirm source media may be sent to Gemini for private review; enter REVIEW_PERMITTED"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wde-gemini-l1-manual
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jimmytobing' &&
      inputs.free_tier_ack == 'FREE_TIER_CONFIRMED' &&
      inputs.rights_ack == 'REVIEW_PERMITTED'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout approved main without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check runner and static script syntax
        run: |
          node --version
          node --check scripts/wde-gemini-editorial-l1.mjs
      - name: One bounded Gemini API request (no retry, no paid fallback)
        env:
          WDE_GEMINI_API_KEY: ${{ secrets.WDE_GEMINI_API_KEY }}
          WDE_FREE_TIER_ACK: ${{ inputs.free_tier_ack }}
          WDE_RIGHTS_ACK: ${{ inputs.rights_ack }}
        run: node scripts/wde-gemini-editorial-l1.mjs
      - name: Upload private one-day candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wde-gemini-l1-${{ github.run_id }}
          path: ${{ runner.temp }}/wde-gemini-l1.json
          if-no-files-found: error
          retention-days: 1

  audit:
    needs: review
    if: always() && github.repository == 'jimmytobing/Syntetic-Wisdom' && github.actor == 'jimmytobing'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add safe status-only audit to existing Issue 35
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## WDE Gemini Editorial L1 — manual workflow\n\n'
            printf 'Job status: **%s**. [Run evidence](%s).\n\n' "$REVIEW_RESULT" "$RUN_URL"
            printf 'One API request maximum; no retry, no Salesforce mutation or publication.\n'
            printf 'Model-reported audio access remains unverified by independent reviewer.\n'
            printf 'Candidates remain AI_L1_PROPOSED; editorial/gold labels and auto-approval stay BLOCKED.\n'
            printf 'Private output artifact retained for one day only. No keys or transcript excerpts posted.\n'
          } > "$RUNNER_TEMP/l1-audit.md"
          gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/l1-audit.md"
