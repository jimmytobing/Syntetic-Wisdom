name: WDE - Gemini Editorial L1 (automated media gate)

on:
  issues:
    types: [edited]
  pull_request:
    paths:
      - '.github/workflows/wde-gemini-editorial-l1.yml'
      - 'scripts/wde-gemini-editorial-l1.mjs'
      - 'tests/wde-gemini-editorial-l1.test.mjs'
      - '.github/mjs/wde-gemini-audio-issue-gate.mjs'
      - 'scripts/wde-autonomous-media-preflight.mjs'
      - 'tests/wde-autonomous-media-preflight.test.mjs'
      - 'tests/wde-gemini-audio-issue-gate.test.mjs'
  workflow_dispatch:
    inputs:
      resume_interaction_id:
        description: "Optional: existing background interaction ID from prior receipt (GET-only, no new inference)"
        required: false
        type: string
      test_mode:
        description: "editorial = previous five windows; audio_probe = one fixed 26-second static clip"
        required: true
        type: choice
        default: audio_probe
        options: [audio_probe, editorial]

permissions:
  contents: read

concurrency:
  group: wde-gemini-l1-manual
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline schema and input tests (no secrets / no API)
        run: |
          node --check scripts/wde-gemini-editorial-l1.mjs
          node --check .github/mjs/wde-gemini-audio-issue-gate.mjs
          node --check scripts/wde-autonomous-media-preflight.mjs
          node --test tests/wde-gemini-editorial-l1.test.mjs tests/wde-gemini-audio-issue-gate.test.mjs tests/wde-autonomous-media-preflight.test.mjs

  review:
    if: >-
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jimmytobing' &&
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'issues' &&
          github.event.action == 'edited' &&
          github.event.issue.number == 54 &&
          github.event.issue.user.login == 'jimmytobing' &&
          contains(github.event.issue.body, '### WDE Request') &&
          contains(github.event.issue.body, 'gemini.audio_probe'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout approved main without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check runner and static script syntax
        run: |
          node --version
          node --check scripts/wde-gemini-editorial-l1.mjs
      - name: Authenticate WDE media rights and claim bounded daily Gemini invocation
        env:
          GH_TOKEN: ${{ github.token }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_RCA_CLIENT_ID || secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_RCA_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
          INPUT_TEST_MODE: ${{ inputs.test_mode }}
          INPUT_RESUME_INTERACTION_ID: ${{ inputs.resume_interaction_id }}
        run: node .github/mjs/wde-gemini-audio-issue-gate.mjs
      - name: One background POST or GET-only resume (bounded polling, no fallback)
        env:
          WDE_GEMINI_API_KEY: ${{ secrets.WDE_GEMINI_API_KEY }}
        run: node scripts/wde-gemini-editorial-l1.mjs
      - name: Upload one-day result and resumable interaction receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wde-gemini-l1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wde-gemini-l1.json
            ${{ runner.temp }}/wde-gemini-audio-probe.json
            ${{ runner.temp }}/wde-gemini-receipt.json
          if-no-files-found: warn
          retention-days: 1

  audit:
    needs: review
    if: >-
      always() &&
      github.repository == 'jimmytobing/Syntetic-Wisdom' &&
      github.actor == 'jimmytobing' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' &&
          github.event.action == 'edited' &&
          github.event.issue.number == 54 &&
          github.event.issue.user.login == 'jimmytobing' &&
          contains(github.event.issue.body, '### WDE Request') &&
          contains(github.event.issue.body, 'gemini.audio_probe'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add safe status-only audit to existing Issue 54
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## WDE Gemini Editorial L1 — authenticated machine-gated workflow\n\n'
            printf 'Job status: **%s**. [Run evidence](%s).\n\n' "$REVIEW_RESULT" "$RUN_URL"
            printf 'Background execution: one inference POST maximum per UTC day, bounded GET polling; resume uses GET only. No retry or publication.\n'
            printf 'Model-reported audio access remains unverified by independent reviewer.\n'
            printf 'Candidates remain AI_L1_PROPOSED; editorial/gold labels and auto-approval stay BLOCKED.\n'
            printf 'Result/receipt artifact retained for one day only. No keys or transcript excerpts posted.\n'
          } > "$RUNNER_TEMP/l1-audit.md"
          gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/l1-audit.md"
