name: WDE Static Metadata Tests

on:
  pull_request:
    paths:
      - '.github/workflows/wde-Test.yaml'
      - 'tests/wde-flow-only-groq-gemini-54.test.mjs'
      - 'manifest/wde-flow-only-groq-gemini-54.xml'
      - 'force-app/main/default/flows/**'
      - 'force-app/main/default/objects/WDE_Batch_Run__c/fields/Status__c.field-meta.xml'
      - 'force-app/main/default/objects/Sermon_Segment__c/fields/Audio_QA_Required__c.field-meta.xml'
      - 'force-app/main/default/namedCredentials/WDE_Groq_API.namedCredential-meta.xml'
      - 'force-app/main/default/externalCredentials/WDE_Groq_External.externalCredential-meta.xml'
      - 'force-app/main/default/permissionsets/WDE_Gemini_Audio_QA_Runtime.permissionset-meta.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wde-Test.yaml'
      - 'tests/wde-flow-only-groq-gemini-54.test.mjs'
      - 'manifest/wde-flow-only-groq-gemini-54.xml'
      - 'force-app/main/default/flows/**'
      - 'force-app/main/default/objects/WDE_Batch_Run__c/fields/Status__c.field-meta.xml'
      - 'force-app/main/default/objects/Sermon_Segment__c/fields/Audio_QA_Required__c.field-meta.xml'
      - 'force-app/main/default/namedCredentials/WDE_Groq_API.namedCredential-meta.xml'
      - 'force-app/main/default/externalCredentials/WDE_Groq_External.externalCredential-meta.xml'
      - 'force-app/main/default/permissionsets/WDE_Gemini_Audio_QA_Runtime.permissionset-meta.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wde-static-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wde-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate only this workflow YAML
        shell: bash
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/wde-Test.yaml")'
      - name: Check static test JavaScript syntax
        shell: bash
        run: node --check tests/wde-flow-only-groq-gemini-54.test.mjs
      - name: Test WDE Flow-only metadata offline (Groq, Gemini, Audio QA)
        shell: bash
        run: node --test tests/wde-flow-only-groq-gemini-54.test.mjs
