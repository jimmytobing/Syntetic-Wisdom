name: Gateway Unit Tests

on:
  pull_request:
    paths:
      - '.github/workflows/sf.yaml'
      - '.github/workflows/jim.yaml'
      - '.github/workflows/gw-unit-test.yaml'
      - '.github/mjs/**'
      - 'tests/gw-unit.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sf.yaml'
      - '.github/workflows/jim.yaml'
      - '.github/workflows/gw-unit-test.yaml'
      - '.github/mjs/**'
      - 'tests/gw-unit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gw-unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate gateway YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/sf.yaml .github/workflows/jim.yaml .github/workflows/gw-unit-test.yaml].each { |f| YAML.load_file(f) }'
      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          for source in .github/mjs/*.mjs tests/gw-unit.test.mjs; do
            node --check "$source"
          done
      - name: Gateway offline unit tests
        shell: bash
        run: node --test tests/gw-unit.test.mjs
