name: Jim - Isolated Bash

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: jim-api-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  jim-bash:
    if: >-
      contains(fromJSON('["jimmytobing","098595"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Jim Bash')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout code without stored Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check exact Jim Bash heading
        id: route
        shell: bash
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -Eq '^### Jim Bash[[:space:]]*$'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute isolated Bash
        id: bash
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: node .github/mjs/jim-bash.mjs
      - name: Upload Bash evidence
        if: always() && steps.route.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jim-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/jim-bash-comment.md
          if-no-files-found: error
          retention-days: 1

  publish-jim-bash:
    needs: jim-bash
    if: always() && needs.jim-bash.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Bash evidence
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: jim-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/jim-bash-result
      - name: Publish terminal output in same Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/jim-bash-result/jim-bash-comment.md"
