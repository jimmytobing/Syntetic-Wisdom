name: WDE Editorial QA

on:
  pull_request:
    paths:
      - '.github/workflows/wde-editorial-qa.yml'
      - 'force-app/main/default/flows/WDE_Orchestrate_Stage_B.flow-meta.xml'
      - 'force-app/main/default/flows/WDE_Auto_Advance_Batch.flow-meta.xml'
      - 'force-app/main/default/flows/Tgr_WDE_Auto_Segment_Audio_QA.flow-meta.xml'
      - 'force-app/main/default/flows/WDE_Verify_Sermon_Segment_Audio.flow-meta.xml'
      - 'force-app/main/default/objects/Sermon_Segment__c/fields/Audio_QA_Required__c.field-meta.xml'
      - 'manifest/wde-flow-only-groq-gemini-54.xml'
      - 'scripts/wde-segmentation-acceptance.mjs'
      - 'scripts/wde-flow-editorial-adapter.mjs'
      - 'tests/wde-segmentation-acceptance.test.mjs'
      - 'tests/wde-flow-editorial-adapter.test.mjs'
      - 'tests/wde-flow-only-groq-gemini-54.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wde-editorial-qa.yml'
      - 'force-app/main/default/flows/WDE_Orchestrate_Stage_B.flow-meta.xml'
      - 'force-app/main/default/flows/Tgr_WDE_Auto_Segment_Audio_QA.flow-meta.xml'
      - 'tests/wde-flow-only-groq-gemini-54.test.mjs'

permissions:
  contents: read

concurrency:
  group: wde-editorial-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check active Flow-only QA source syntax
        run: |
          set -euo pipefail
          node --check scripts/wde-segmentation-acceptance.mjs
          node --check scripts/wde-flow-editorial-adapter.mjs
          node --check tests/wde-segmentation-acceptance.test.mjs
          node --check tests/wde-flow-editorial-adapter.test.mjs
          node --check tests/wde-flow-only-groq-gemini-54.test.mjs
      - name: Test segmentation coverage and selective Gemini gate without network
        run: node --test tests/wde-segmentation-acceptance.test.mjs tests/wde-flow-editorial-adapter.test.mjs tests/wde-flow-only-groq-gemini-54.test.mjs
