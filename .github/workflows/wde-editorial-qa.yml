name: WDE Editorial QA

on:
  pull_request:
    paths:
      - "scripts/wde-opener-handoff-qa.mjs"
      - "scripts/wde-segmentation-acceptance.mjs"
      - "scripts/wde-flow-editorial-adapter.mjs"
      - "scripts/wde-commit-release-readiness.mjs"
      - "scripts/wde-independent-qa-receipt.mjs"
      - "scripts/wde-autonomous-media-preflight.mjs"
      - "scripts/wde-audio-qa-calibration.mjs"
      - "scripts/wde-qa-release-key.mjs"
      - "tests/wde-qa-release-key.test.mjs"
      - "tests/wde-audio-qa-calibration.test.mjs"
      - "tests/wde-autonomous-media-preflight.test.mjs"
      - "scripts/wde-independent-qa-issuer.mjs"
      - "scripts/wde-independent-semantic-decision.mjs"
      - "scripts/wde-stored-qa-evidence.mjs"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/QA_Signed_Receipt__c.field-meta.xml"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/QA_Enrichment_SHA256__c.field-meta.xml"
      - "tests/wde-stored-qa-evidence.test.mjs"
      - "tests/wde-independent-qa-issuer.test.mjs"
      - "tests/wde-independent-semantic-decision.test.mjs"
      - "force-app/main/default/flows/Tgr_WDE_Run_Stage_B.flow-meta.xml"
      - "force-app/main/default/flows/Tgr_WDE_Run_Stage_C.flow-meta.xml"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/Status__c.field-meta.xml"
      - "tests/wde-opener-handoff-qa.test.mjs"
      - "tests/wde-segmentation-acceptance.test.mjs"
      - "tests/wde-flow-editorial-adapter.test.mjs"
      - "tests/wde-flow-commit-gate.test.mjs"
      - "tests/wde-commit-release-readiness.test.mjs"
      - ".github/workflows/wde-editorial-qa.yml"
  push:
    branches:
      - "feature/wde-hive-content-planning-35"
    paths:
      - "scripts/wde-opener-handoff-qa.mjs"
      - "scripts/wde-segmentation-acceptance.mjs"
      - "scripts/wde-flow-editorial-adapter.mjs"
      - "scripts/wde-commit-release-readiness.mjs"
      - "scripts/wde-independent-qa-receipt.mjs"
      - "scripts/wde-autonomous-media-preflight.mjs"
      - "scripts/wde-audio-qa-calibration.mjs"
      - "scripts/wde-qa-release-key.mjs"
      - "tests/wde-qa-release-key.test.mjs"
      - "tests/wde-audio-qa-calibration.test.mjs"
      - "tests/wde-autonomous-media-preflight.test.mjs"
      - "scripts/wde-independent-qa-issuer.mjs"
      - "scripts/wde-independent-semantic-decision.mjs"
      - "scripts/wde-stored-qa-evidence.mjs"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/QA_Signed_Receipt__c.field-meta.xml"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/QA_Enrichment_SHA256__c.field-meta.xml"
      - "tests/wde-stored-qa-evidence.test.mjs"
      - "tests/wde-independent-qa-issuer.test.mjs"
      - "tests/wde-independent-semantic-decision.test.mjs"
      - "force-app/main/default/flows/Tgr_WDE_Run_Stage_B.flow-meta.xml"
      - "force-app/main/default/flows/Tgr_WDE_Run_Stage_C.flow-meta.xml"
      - "force-app/main/default/objects/WDE_Batch_Run__c/fields/Status__c.field-meta.xml"
      - "tests/wde-opener-handoff-qa.test.mjs"
      - "tests/wde-segmentation-acceptance.test.mjs"
      - "tests/wde-flow-editorial-adapter.test.mjs"
      - "tests/wde-flow-commit-gate.test.mjs"
      - "tests/wde-commit-release-readiness.test.mjs"
      - ".github/workflows/wde-editorial-qa.yml"

permissions:
  contents: read

jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/wde-opener-handoff-qa.mjs
          node --check tests/wde-opener-handoff-qa.test.mjs
          node --check scripts/wde-segmentation-acceptance.mjs
          node --check tests/wde-segmentation-acceptance.test.mjs
          node --check scripts/wde-flow-editorial-adapter.mjs
          node --check tests/wde-flow-editorial-adapter.test.mjs
          node --check tests/wde-flow-commit-gate.test.mjs
          node --check scripts/wde-commit-release-readiness.mjs
          node --check tests/wde-commit-release-readiness.test.mjs
          node --check scripts/wde-independent-qa-receipt.mjs
          node --check scripts/wde-autonomous-media-preflight.mjs
          node --check scripts/wde-audio-qa-calibration.mjs
          node --check scripts/wde-qa-release-key.mjs
          node --check tests/wde-qa-release-key.test.mjs
          node --check tests/wde-audio-qa-calibration.test.mjs
          node --check tests/wde-autonomous-media-preflight.test.mjs
          node --check scripts/wde-stored-qa-evidence.mjs
          node --check tests/wde-stored-qa-evidence.test.mjs
          node --check scripts/wde-independent-qa-issuer.mjs
          node --check tests/wde-independent-qa-issuer.test.mjs
          node --check scripts/wde-independent-semantic-decision.mjs
          node --check tests/wde-independent-semantic-decision.test.mjs
      - name: Run source-anchored editorial QA unit tests
        run: node --test tests/wde-opener-handoff-qa.test.mjs tests/wde-segmentation-acceptance.test.mjs tests/wde-flow-editorial-adapter.test.mjs tests/wde-flow-commit-gate.test.mjs tests/wde-commit-release-readiness.test.mjs tests/wde-stored-qa-evidence.test.mjs tests/wde-independent-qa-issuer.test.mjs tests/wde-independent-semantic-decision.test.mjs tests/wde-autonomous-media-preflight.test.mjs tests/wde-audio-qa-calibration.test.mjs tests/wde-qa-release-key.test.mjs
